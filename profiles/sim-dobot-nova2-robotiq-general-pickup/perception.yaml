model_config: ~/.paos-rekep/models/dinov2/config.json
frame_id: nova2_base
# Recognizable colors are the perception's object vocabulary: every
# connected blob of one palette color is one object; region colors mark
# static target areas. Hue only, so shadows do not change a label.
segmentation:
  backend: sim_color_palette
  minimum_component_pixels: 100
  min_saturation: 45
  min_object_value: 60
  max_hue_distance_deg: 18
  merge_distance_m: 0.05
  object_colors:
    red: [0.85, 0.12, 0.12]
    orange: [0.95, 0.50, 0.08]
    yellow: [0.95, 0.85, 0.12]
    cyan: [0.10, 0.75, 0.80]
    blue: [0.12, 0.25, 0.85]
    purple: [0.55, 0.18, 0.75]
    pink: [0.95, 0.35, 0.65]
  region_colors:
    green: [0.10, 0.85, 0.20]
# Each object is registered at its first observation: center (top-face area
# centroid; mid height between top face and lowest visible point), top and
# bottom centers, outermost top-face points along its principal axes and
# DINOv2 feature points, then tracked by trimmed ICP (translation + yaw).
keypoints: {dinov2_per_object: 1, grid_cell_m: 0.002, top_face_tolerance_m: 0.004, bottom_quantile: 0.02}
tracker: {max_reassociation_distance_m: 0.08}
freshness: {max_age_ms: 1500}
# Region volume: from the region surface up to volume_height_m. Region
# surface cells are accumulated over the scene revision (regions are static).
# Only points within 2 mm of the surface height count: edge pixels can be
# green while their depth falls on the support below.
targets: {volume_height_m: 0.10, surface_height_tolerance_m: 0.002}
camera:
  width: 640
  height: 480
  fx: 539.0
  fy: 539.0
  cx: 319.5
  cy: 239.5
  depth_min_m: 0.02
  depth_max_m: 2.0
  depth_unit_scale: 1.0
  base_from_camera:
    - [0.803, 0.354, -0.479184, 0.78]
    - [0.596, -0.477, 0.645612, -1.05]
    - [0.0, -0.804, -0.594015, 0.69]
    - [0.0, 0.0, 0.0, 1.0]
# Test-video frames for acceptance evidence (runtime root, pruned after
# retention). File names carry wall and simulator time for real-time factor.
recording: {enabled: true, fps: 10, retention_s: 3600, trigger: execution, stop_delay_s: 10}
