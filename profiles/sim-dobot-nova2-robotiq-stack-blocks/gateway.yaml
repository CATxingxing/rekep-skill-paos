host: 127.0.0.1
port: 19021
joint_order: []
image_input_ids: []
readiness: {require_proprio_state: false, require_images: false}
tools:
  enabled: true
  lease_ttl_ms: 5000
  invoke_timeout_ms: 600000
  request_input_id: tool_request
  response_output_id: tool_response
  specs:
    - tool_id: rekep.get_context
      implementation_id: rekep.dinov2
      endpoint_id: rekep.perception
      operation: get_context
      semantics: query
      description: Capture the current shared RGB-D scene and return immutable DINOv2 keypoints.
      input_schema: {type: object, additionalProperties: false}
      output_schema: {type: object}
      readiness: []
    - tool_id: rekep.plan_task
      implementation_id: rekep.vlm_constraints
      endpoint_id: rekep.planner
      operation: plan_task
      semantics: action
      description: Ask the current PAOS VLM for a restricted observation-bound ReKep constraint program without motion.
      input_schema:
        type: object
        additionalProperties: false
        required: [instruction, session_id, observation_id]
        properties:
          instruction: {type: string, minLength: 1}
          session_id: {type: string, minLength: 1}
          observation_id: {type: string, pattern: "^sha256:[0-9a-f]{64}$"}
      output_schema: {type: object}
      readiness: []
    - tool_id: rekep.execute_task
      implementation_id: rekep.serial_executor
      endpoint_id: rekep.executor
      operation: execute_task
      semantics: action
      description: Solve and serially execute one exact digest-bound program through standard controllers.
      input_schema:
        type: object
        additionalProperties: false
        required: [session_id, scene_revision, observation_id, plan_id, plan_digest, allow_motion, deadline_ms]
        properties:
          session_id: {type: string, minLength: 1}
          scene_revision: {type: integer, minimum: 0}
          observation_id: {type: string, pattern: "^sha256:[0-9a-f]{64}$"}
          plan_id: {type: string, minLength: 1}
          plan_digest: {type: string, pattern: "^sha256:[0-9a-f]{64}$"}
          allow_motion: {const: true}
          deadline_ms: {type: integer, minimum: 1, maximum: 600000}
      output_schema: {type: object}
      readiness: []
  providers:
    - {endpoint_id: rekep.perception, input_id: perception_tool_in, output_id: perception_tool_out}
    - {endpoint_id: rekep.planner, input_id: planner_tool_in, output_id: planner_tool_out}
    - {endpoint_id: rekep.executor, input_id: executor_tool_in, output_id: executor_tool_out}
