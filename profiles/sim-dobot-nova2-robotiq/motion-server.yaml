state_timeout_ms: 500
planning_timeout_ms: 3000
# The child controller may legitimately use its full 3000 ms goal-settling
# window. Keep the parent deadline later so the child's structured terminal
# result wins instead of racing a parent-side cancellation.
execution_timeout_margin_ms: 5000
final_state_timeout_ms: 500
child_cancel_retry_ms: 100
child_cancel_timeout_ms: 1500
result_cache_size: 128
groups:
  nova2_arm:
    joint_names: [joint1, joint2, joint3, joint4, joint5, joint6]
    urdf_path: ../../assets/dobot-nova2-robotiq/urdf/dobot_rviz/nova2_robot.urdf
    base_frame: base_link
    tip_frame: pinch
    max_velocity: {joint1: 1.0, joint2: 1.0, joint3: 1.0, joint4: 1.0, joint5: 1.0, joint6: 1.0}
    max_acceleration: {joint1: 2.0, joint2: 2.0, joint3: 2.0, joint4: 2.0, joint5: 2.0, joint6: 2.0}
    trajectory_sample_period_ms: 50
    max_trajectory_points: 10000
    start_velocity_tolerance: 0.10
    final_joint_tolerance: 0.03
    final_position_tolerance_m: 0.01
    final_orientation_tolerance_rad: 0.08
    ik_max_solution_joint_displacement: 1.0
