joint_names: [joint1, joint2, joint3, joint4, joint5, joint6]
control_period_ms: 20
feedback_timeout_ms: 500
start_position_tolerance: 0.10
path_position_tolerance: 0.15
# Keep joint completion tight enough to satisfy the motion server's 10 mm
# Cartesian terminal check, including the first loaded lift after grasp.
goal_position_tolerance: 0.01
goal_velocity_tolerance: 0.05
# The position actuators need extra settling time to meet the tightened
# 0.01 rad terminal tolerance under gripper/object load.
goal_time_tolerance_ms: 3000
result_cache_size: 128
