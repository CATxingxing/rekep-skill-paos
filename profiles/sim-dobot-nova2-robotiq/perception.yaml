model_config: ~/.paos-rekep/models/dinov2/config.json
frame_id: nova2_base
segmentation: {backend: sim_color_components, minimum_component_pixels: 100}
keypoints: {per_object: 3}
tracker: {max_reassociation_distance_m: 0.08}
freshness: {max_age_ms: 1500}
# Depth keypoints lie on the visible top face.  With the raised support pad,
# this 100 mm volume has its center at the resting top-face height.
targets: {volume_height_m: 0.10}
camera:
  width: 640
  height: 480
  fx: 539.0
  fy: 539.0
  cx: 319.5
  cy: 239.5
  depth_min_m: 0.02
  depth_max_m: 2.0
  depth_unit_scale: 1.0
  base_from_camera:
    - [0.803, 0.354, -0.479184, 0.78]
    - [0.596, -0.477, 0.645612, -1.05]
    - [0.0, -0.804, -0.594015, 0.69]
    - [0.0, 0.0, 0.0, 1.0]
