[project]
name = "rekep-paos"
version = "0.4.8"
description = "Observation-bound ReKep nodes and PhyAgentOS Skill packaging"
requires-python = ">=3.12"
dependencies = [
  "dora-rs==0.4.1",
  "forge-msgs==1.3.0",
  "forge-tool==1.0.0",
  "numpy==1.26.4",
  "pillow>=12,<13",
  "pyarrow>=23,<24",
  "pyyaml>=6,<7",
  "scipy>=1.17,<2",
  "torch>=2.14,<3",
]

[project.optional-dependencies]
build = ["pyinstaller>=6.22,<7"]
dev = ["pytest>=8,<10"]

[tool.pytest.ini_options]
pythonpath = ["nodes/common", "nodes/rekep-perception", "nodes/rekep-planner", "nodes/rekep-executor"]
testpaths = ["tests"]
addopts = "-q"

[tool.uv]
environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'"]

[[tool.uv.index]]
name = "tuna"
url = "https://pypi.tuna.tsinghua.edu.cn/simple"
default = true
